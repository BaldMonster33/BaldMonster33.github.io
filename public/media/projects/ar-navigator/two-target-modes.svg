<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">Two ways to choose what to find</title><desc id="desc">Object detection for common categories and uploaded image references for specific visual targets feed the same target-selection and guidance flow.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif}</style></defs>
<rect width="1600" height="800" fill="#142f29"/><text x="75" y="82" fill="#a9c3ad" font-size="19" letter-spacing="3">INTERACTION DESIGN / TWO ENTRY POINTS</text><text x="73" y="161" fill="#f0efde" font-size="53" font-weight="700">Choose a common object—or your own reference.</text>
<g transform="translate(75 237)"><rect width="580" height="243" rx="22" fill="#dce8d5"/><text x="30" y="48" fill="#45674f" font-size="18" letter-spacing="2">MODE 01</text><text x="30" y="99" fill="#1d4633" font-size="34" font-weight="700">Object detection</text><text x="30" y="147" fill="#426448" font-size="23">Run YOLOv3-tiny on the camera feed.</text><text x="30" y="184" fill="#426448" font-size="23">Select a detected object as the target.</text><text x="30" y="221" fill="#648268" font-size="18">80 object categories in the model label set</text></g>
<g transform="translate(945 237)"><rect width="580" height="243" rx="22" fill="#eee2c8"/><text x="30" y="48" fill="#7f6846" font-size="18" letter-spacing="2">MODE 02</text><text x="30" y="99" fill="#533f28" font-size="34" font-weight="700">Image references</text><text x="30" y="147" fill="#7b6341" font-size="23">Choose an image and give it a label.</text><text x="30" y="184" fill="#7b6341" font-size="23">Track the reference through AR Foundation.</text><text x="30" y="221" fill="#927b57" font-size="18">For specific images or visual markers</text></g>
<path d="M365 498v49q0 25 25 25h385M1235 498v49q0 25-25 25H825M800 572v49" fill="none" stroke="#bdccac" stroke-width="3"/><circle cx="800" cy="572" r="11" fill="#ddc08b"/>
<rect x="350" y="637" width="900" height="98" rx="20" fill="#294b3e" stroke="#6a8970"/><text x="800" y="679" text-anchor="middle" fill="#efedd8" font-size="27" font-weight="700">One guidance loop</text><text x="800" y="714" text-anchor="middle" fill="#bcd0b7" font-size="22">Select → point → listen or feel → stop searching</text>
</svg>
