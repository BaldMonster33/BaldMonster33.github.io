<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800" role="img"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#102134" stroke="none"/><text x="52" y="59" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#8abaff" letter-spacing="2">XLNET × TRIP / COMMONSENSE REASONING</text><text x="52" y="119" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#f2f7fe" >Checking a story's explanation</text><text x="52" y="159" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6cbe1" >Evaluate the choice, the conflict, and the physical evidence.</text><rect x="52" y="205" width="590" height="398" rx="22" fill="#1a3048" stroke="#314c69"/><text x="80" y="249" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8abaff" letter-spacing="1.3">ILLUSTRATIVE STORY</text><rect x="80" y="282" width="534" height="97" rx="12" fill="#233d58" stroke="none"/><text x="103" y="319" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#8abaff" >01</text><text x="147" y="320" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f2f7fe" >Gina shattered the glass.</text><text x="147" y="353" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#b6cbe1" >State after: broken</text><rect x="80" y="401" width="534" height="112" rx="12" fill="#382f46" stroke="#a985a9"/><text x="103" y="439" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ecbacf" >02</text><text x="147" y="439" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f2f7fe" >Gina filled the unbroken glass.</text><text x="147" y="475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#ecc7d7" >Required state: intact</text><text x="80" y="554" font-fami