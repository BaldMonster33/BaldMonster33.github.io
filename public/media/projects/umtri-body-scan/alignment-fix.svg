<rect x="74" y="689" width="1452" height="126" rx="18" fill="#1c3d34"/>
<circle cx="119" cy="733" r="9" fill="#b9ddaa"/><text x="147" y="742" fill="#f1f1e8" font-size="27" font-weight="700">Fix the correspondence, then reconstruct.</text>
<text x="108" y="782" fill="#c1d2c7" font-size="23">I corrected image-to-transform alignment and mapped detections back into one scan coordinate frame.</text>
