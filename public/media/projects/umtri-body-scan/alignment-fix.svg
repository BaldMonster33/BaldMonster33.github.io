<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc"><title id="title">Debugging the image-to-transform mismatch</title><desc id="desc">A schematic of nine rendered images at 45-degree intervals, with the repeated 360-degree endpoint, compared with an early sequence of only eight stored camera transforms. The fix aligned image and transform indexing before mapping detections to a shared coordinate frame.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}</style></defs>
<rect width="1600" height="880" fill="#f0eee7"/>
<text x="74" y="77" fill="#52685e" font-size="19" letter-spacing="3">ENGINEERING INSIGHT / COORDINATE FRAMES</text>
<text x="74" y="158" fill="#1b3530" font-size="54" font-weight="700" letter-spacing="-1">The hard part was alignment.</text>
<text x="76" y="211" fill="#486059" font-size="25">A correct 2D detection still needs the correct 3D transform.</text>
<text x="78" y="295" fill="#1b3530" font-size="22" font-weight="700">Rendered images</text>
<text x="78" y="515" fill="#1b3530" font-size="22" font-weight="700">Early transform sequence</text>
