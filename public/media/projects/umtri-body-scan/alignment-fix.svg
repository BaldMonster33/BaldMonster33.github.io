" stroke="#a9bfb1"/><path d="M20 77h101M47 68l23-24 23 24M64 43a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" fill="none" stroke="#4f7d69" stroke-width="2"/><text class="mono" x="70" y="96" text-anchor="middle" fill="#23463b" font-size="18">135°</text></g><path d="M635 445v30" fill="none" stroke="#4d776b" stroke-width="2" stroke-dasharray="6 7"/><g transform="translate(565 554)"><rect width="141" height="66" rx="12" fill="#fffdf7" stroke="#4d776b" stroke-width="2" /><text x="70" y="41" text-anchor="middle" class="mono" fill="#4d776b" font-size="20">T3</text></g><g transform="translate(728 326)"><rect width="141" height="107" rx="12" fill="#dce8e0" stroke="#a9bfb1"/><path d="M20 77h101M47 68l23-24 23 24M64 43a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" fill="none" stroke="#4f7d69" stroke-width="2"/><text class="mono" x="70" y="96" text-anchor="middle" fill="#23463b" font-size="18">180°</text></g><path d="M798 445v30" fill="none" stroke="#4d776b" stroke-width="2" stroke-dasharray="6 7"/><g transform="translate(728 554)"><rect width="141" height="66" rx="12" fill="#fffdf7" stroke="#4d776b" stroke-width="2" /><text x="70" y="41" text-anchor="middle" class="mono" fill="#4d776b" font-size="20">T4</text></g><g transform="translate(891 326)"><rect width="141" height="107" rx="12" fill="#dce8e0" stroke="#a9bfb1"/><path d="M20 77h101M47 68l23-24 23 24M64 43a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" fill="none" stroke="#4f7d69" stroke-width="2"/><text class="mono" x="70" y="96" text-anchor="middle" fill="#23463b" font-size="18">225°</text></g><path d="M961 445v30" fill="none" stroke="#4d776b" stroke-width="2" stroke-dasharray="6 7"/><g transform="translate(891 554)"><rect width="141" height="66" rx="12" fill="#fffdf7" stroke="#4d776b" stroke-width="2" /><text x="70" y="41" text-anchor="middle" class="mono" fill="#4d776b" font-size="20">T5</text></g><g transform="translate(1054 326)"><rect width="141" height="107" rx="12" fill="#dce8e0" stroke="#a9bfb1"/><path d="M20 77h101M47 68l23-24 23 24M64 43a7 7 0 1 0 14 0a